name: Check upstream & Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  # Only build the shared library, nothing else.
  LIBOPENMPT_LIBRARY_ONLY: >-
    SHARED_LIB=1 STATIC_LIB=0 EXAMPLES=0 OPENMPT123=0 TEST=0
  # Build without any system dependencies, using the copies of zlib/mpg123/ogg/vorbis
  # that are bundled with the upstream sources, so no packages need to be installed.
  LIBOPENMPT_BUNDLED_DEPS: >-
    LOCAL_ZLIB=1 LOCAL_MPG123=1 LOCAL_OGG=1 LOCAL_VORBIS=1
    NO_PORTAUDIO=1 NO_PORTAUDIOCPP=1 NO_PULSEAUDIO=1 NO_SDL2=1 NO_FLAC=1 NO_SNDFILE=1

permissions:
  contents: write
  packages: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check_upstream.outputs.version }}
      commit:  ${{ steps.check_upstream.outputs.commit  }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run:  npm install semver

      - name: Check for upstream updates
        id:   check_upstream
        uses: actions/github-script@v8
        env:
          CURRENT_UPSTREAM_VERSION: ${{ vars.CURRENT_UPSTREAM_VERSION }}
        with:
          script: |
            const semverCompare = require("semver/functions/compare");

            let { data: tags } = await github.rest.repos.listTags({ owner: "OpenMPT", repo: "openmpt" });
            let latestTag = tags.filter(tag => tag.name.startsWith("libopenmpt-"))
                                .map(tag => ({ version: tag.name.substring(11), commit: tag.commit.sha }))
                                .sort((a, b) => semverCompare(b.version, a.version))
                                [0];

            if (semverCompare(latestTag.version, process.env.CURRENT_UPSTREAM_VERSION) <= 0)
                return;

            core.setOutput("version", latestTag.version);
            core.setOutput("commit",  latestTag.commit);

  build-native-linux:
    needs: check-upstream
    if: needs.check-upstream.outputs.commit != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Git checkout upstream
        uses: actions/checkout@v6
        with:
          repository: 'OpenMPT/openmpt'
          ref: '${{ needs.check-upstream.outputs.commit }}'
          path: 'include'

      - name: Build native library (linux-x64)
        run: |
          make -C include -j"$(nproc)" CONFIG=gcc SHARED_SONAME=0 \
            $LIBOPENMPT_LIBRARY_ONLY $LIBOPENMPT_BUNDLED_DEPS
          mkdir -p native/linux-x64
          mv include/bin/libopenmpt.so native/linux-x64/

      - name: Upload native library (linux-x64)
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: native/linux-x64
          if-no-files-found: error

  build-native-macos:
    needs: check-upstream
    if: needs.check-upstream.outputs.commit != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       arch: arm64,  rid: osx-arm64, min_version: '11.0'  }
          - { runner: macos-15-intel, arch: x86_64, rid: osx-x64,   min_version: '10.15' }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Git checkout upstream
        uses: actions/checkout@v6
        with:
          repository: 'OpenMPT/openmpt'
          ref: '${{ needs.check-upstream.outputs.commit }}'
          path: 'include'

      - name: Build native library (${{ matrix.rid }})
        run: |
          make -C include -j"$(sysctl -n hw.ncpu)" SOSUFFIX=.dylib \
            ARCH=${{ matrix.arch }} MACOSX_VERSION_MIN=${{ matrix.min_version }} \
            $LIBOPENMPT_LIBRARY_ONLY $LIBOPENMPT_BUNDLED_DEPS
          mkdir -p native/${{ matrix.rid }}
          mv include/bin/libopenmpt.dylib native/${{ matrix.rid }}/

      - name: Upload native library (${{ matrix.rid }})
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}
          if-no-files-found: error

  build:
    needs: [check-upstream, build-native-linux, build-native-macos]
    if: needs.check-upstream.outputs.commit != ''
    runs-on: windows-2022
    permissions:
      packages: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Git checkout upstream
        uses: actions/checkout@v6
        with:
          repository: 'OpenMPT/openmpt'
          ref: '${{ needs.check-upstream.outputs.commit }}'
          path: 'include'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build native library (win-x64)
        run:  msbuild include/build/vs2022win10/libopenmpt.sln /m /t:libopenmpt /p:Platform=x64 /p:Configuration=ReleaseShared

      - name: Download native library (linux-x64)
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native/linux-x64

      - name: Download native library (osx-x64)
        uses: actions/download-artifact@v8
        with:
          name: native-osx-x64
          path: native/osx-x64

      - name: Download native library (osx-arm64)
        uses: actions/download-artifact@v8
        with:
          name: native-osx-arm64
          path: native/osx-arm64

      - name: Verify native libraries
        shell: pwsh
        run: |
          $libraries = @(
            'include\bin\release\vs2022-win10-shared\amd64\libopenmpt.dll',
            'native\linux-x64\libopenmpt.so',
            'native\osx-x64\libopenmpt.dylib',
            'native\osx-arm64\libopenmpt.dylib'
          )
          $missing = $libraries.Where({ -not (Test-Path $_) })
          if ($missing) {
            Write-Error "Missing native libraries: $($missing -join ', ')"
            exit 1
          }

      - name: Build managed library and nuget package
        run:  dotnet pack -c Release /p:ContinuousIntegrationBuild=true /p:Version=${{ needs.check-upstream.outputs.version }} /p:NativeLibsDir="${{ github.workspace }}\native"

      - name: Upload nuget package
        run:  dotnet nuget push bin/LibOpenMPT.NET/Release/LibOpenMPT.NET.${{ needs.check-upstream.outputs.version }}.nupkg -k ${{ github.token }} -s https://nuget.pkg.github.com/${{ github.event.repository.owner.login }}/index.json

  update-version:
    needs: [check-upstream, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          CURRENT_UPSTREAM_VERSION: ${{ needs.check-upstream.outputs.version }}
        with:
          github-token: ${{ secrets.PAT_Variable_ReadWrite }}
          script: |
            await github.rest.actions.updateRepoVariable({
                owner: context.payload.repository.owner.login,
                repo:  context.payload.repository.name,
                name:  "CURRENT_UPSTREAM_VERSION",
                value: process.env.CURRENT_UPSTREAM_VERSION
            });
